[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "typed-models"
version = "0.1.0"
description = "Small encoders for typed decisions and typed extraction: training recipes for the tasksource models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch", "transformers>=5", "datasets", "huggingface_hub", "safetensors", "numpy", "pandas", "pyarrow"]

[project.optional-dependencies]
decider = ["tasksource", "decision-index @ git+https://github.com/apolinario/decision-index"]
extraction = ["tasknet", "tasksource", "python-dateutil"]
nli = ["tasknet", "tasksource"]

[tool.setuptools.packages.find]
include = ["typed_models"]
